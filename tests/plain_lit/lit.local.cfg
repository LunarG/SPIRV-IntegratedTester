# lit runs a lit.local.cfg for its own directory and every directory below it,
# on a copy of the parent config.
#
# This directory shows tests written for lit's stock ShTest format, with no
# custom code: each RUN: line runs exactly as written, %t names this test's
# temp files, and REQUIRES: names the tool features that lit.cfg.py defines.
# The substitutions (%glslang, %spirv_dis, %check, ...) still come from
# tests/lit.cfg.py.
#
# The .test suffix keeps spirv_tester.py from picking these files up. The
# compilers are told the language with a flag instead of the file extension.
#
# pylint: disable=undefined-variable

import lit.formats

config.test_format = lit.formats.ShTest(execute_external=False)
config.suffixes = [".test"]
